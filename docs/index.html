<!DOCTYPE html>
<html lang="ru" data-theme="portal">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vi-planer-theme");
          if (t !== "vi" && t !== "portal") t = "portal";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "portal");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VI Planer — сквозной приоритет и дата завершения</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.svg" />
    <meta name="theme-color" content="#d60000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/vi_planer/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/vi_planer/assets/style.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
