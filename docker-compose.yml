services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viplaner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: viplaner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viplaner -d viplaner"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8787}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      DATABASE_URL: postgres://viplaner:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/viplaner
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
